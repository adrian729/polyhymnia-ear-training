allowBuilds:
  esbuild: true
# These packages are the owner's own, published by the owner's trusted-publishing workflow, so the
# supply-chain release-age delay protects nothing. Version-free, so a fresh release needs no new entry.
minimumReleaseAgeExclude:
  - '@polyhymnia/*'
  - '@ranx729/elder-scrolls'
  - '@ranx729/ducktape-assets'
  - '@ranx729/ducktape-assets-*'
